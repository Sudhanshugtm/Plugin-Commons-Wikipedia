<!DOCTYPE html>
<html>
  <head>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <style>
      /* Wikipedia-style formatting */
      #text-search-content {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Lato, Helvetica, Arial, sans-serif;
        color: #202122;
        line-height: 1.6;
      }

      #text-search-content a {
        color: #0645ad;
        text-decoration: none;
      }

      #text-search-content a:visited {
        color: #0b0080;
      }

      #text-search-content a:hover {
        text-decoration: underline;
      }

      #text-search-content sup {
        line-height: 1;
      }

      #text-search-content .reference {
        font-size: 0.8em;
        font-weight: normal;
      }

      #text-search-content .mw-editsection {
        display: none;
      }

      #text-search-content p {
        margin-bottom: 0.5em;
      }

      #text-search-content h2 {
        color: #202122;
        font-family: 'Linux Libertine', Georgia, Times, serif;
        font-size: 1.5rem;
        font-weight: normal;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid #a2a9b1;
        padding-bottom: 0.25rem;
      }

      #text-search-content h3 {
        color: #202122;
        font-family: 'Linux Libertine', Georgia, Times, serif;
        font-size: 1.25rem;
        font-weight: normal;
        margin-top: 1.25rem;
        margin-bottom: 0.25rem;
      }

      #text-search-content ul, #text-search-content ol {
        margin-left: 1.6em;
        margin-bottom: 0.5em;
      }

      #text-search-content .infobox {
        float: right;
        clear: right;
        margin: 0 0 1em 1em;
        width: 22em;
        border: 1px solid #a2a9b1;
        background-color: #f8f9fa;
        padding: 0.5em;
      }

      #text-search-content table {
        border-collapse: collapse;
      }

      #text-search-content .thumbinner {
        border: 1px solid #c8ccd1;
        padding: 3px;
        background-color: #f8f9fa;
        font-size: 94%;
        text-align: center;
      }

      #text-search-content .thumbcaption {
        padding: 3px;
        font-size: 94%;
        line-height: 1.4em;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const TAB_IMAGE = 'image';
        const TAB_TEXT = 'text';
        const DEFAULT_IMAGE_WIDTH = 600;
        const REFERENCE_SELECTOR = '.reference, .mw-ref';
        const LOADING_TICK_MS = 200;
        const LOADING_INCREMENT_MIN = 4;
        const LOADING_INCREMENT_MAX = 10;
        const MAX_LOADING_PROGRESS = 90;

        const state = {
          activeTab: TAB_IMAGE,
          lastQuery: '',
          loadingProgress: 0,
          loadingIntervalId: null,
        };

        const elements = {
          tabImage: document.getElementById('tab-image'),
          tabText: document.getElementById('tab-text'),
          tabImageContent: document.getElementById('tab-image-content'),
          tabTextContent: document.getElementById('tab-text-content'),
          imageQueryInput: document.getElementById('search-query'),
          textQueryInput: document.getElementById('text-search-query'),
          imageSearchButton: document.getElementById('search-image-button'),
          textSearchButton: document.getElementById('search-text-button'),
          imageResults: document.getElementById('search-results'),
          textTitle: document.getElementById('text-search-title'),
          textContent: document.getElementById('text-search-content'),
          loadingIndicator: document.getElementById('loadingIndicator'),
        };

        const loadingBarFill = elements.loadingIndicator
          ? elements.loadingIndicator.querySelector('div')
          : null;

        function notify(message) {
          parent.postMessage({ pluginMessage: { type: 'notify', message } }, '*');
        }

        function setLoadingIndicator(show) {
          if (!elements.loadingIndicator || !loadingBarFill) {
            return;
          }

          if (show) {
            elements.loadingIndicator.classList.remove('hidden');
            state.loadingProgress = 0;
            loadingBarFill.style.width = '0%';

            if (state.loadingIntervalId !== null) {
              clearInterval(state.loadingIntervalId);
            }

            state.loadingIntervalId = window.setInterval(() => {
              const increment =
                LOADING_INCREMENT_MIN +
                Math.random() * (LOADING_INCREMENT_MAX - LOADING_INCREMENT_MIN);
              state.loadingProgress = Math.min(
                state.loadingProgress + increment,
                MAX_LOADING_PROGRESS
              );
              loadingBarFill.style.width = `${state.loadingProgress}%`;
            }, LOADING_TICK_MS);
          } else {
            if (state.loadingIntervalId !== null) {
              clearInterval(state.loadingIntervalId);
              state.loadingIntervalId = null;
            }
            loadingBarFill.style.width = '100%';
            window.setTimeout(() => {
              elements.loadingIndicator.classList.add('hidden');
              loadingBarFill.style.width = '0%';
              state.loadingProgress = 0;
            }, 300);
          }
        }

        function switchTab(tab) {
          state.activeTab = tab;
          toggleTab(elements.tabImage, elements.tabImageContent, tab === TAB_IMAGE);
          toggleTab(elements.tabText, elements.tabTextContent, tab === TAB_TEXT);
          syncSearchInputs();
        }

        function toggleTab(tabElement, contentElement, isActive) {
          if (!tabElement || !contentElement) {
            return;
          }

          tabElement.classList.toggle('text-blue-600', isActive);
          tabElement.classList.toggle('border-blue-500', isActive);
          tabElement.classList.toggle('border-b-2', isActive);
          tabElement.classList.toggle('text-gray-500', !isActive);
          tabElement.classList.toggle('border-transparent', !isActive);
          tabElement.setAttribute('aria-current', isActive ? 'page' : 'false');
          contentElement.classList.toggle('hidden', !isActive);
        }

        function syncSearchInputs() {
          if (elements.imageQueryInput) {
            elements.imageQueryInput.value = state.lastQuery;
          }
          if (elements.textQueryInput) {
            elements.textQueryInput.value = state.lastQuery;
          }
        }

        function validateQuery(query) {
          if (!query) {
            notify('Please enter a search term to continue.');
            return false;
          }
          if (query.length > 120) {
            notify('Please shorten the search term (120 character limit).');
            return false;
          }
          if (/[<>]/.test(query)) {
            notify('Angle brackets are not allowed in search terms.');
            return false;
          }
          return true;
        }

        function setControlsDisabled(target, disabled) {
          if (target === TAB_IMAGE) {
            if (elements.imageSearchButton) {
              elements.imageSearchButton.disabled = disabled;
            }
            if (elements.imageQueryInput) {
              elements.imageQueryInput.disabled = disabled;
            }
          } else {
            if (elements.textSearchButton) {
              elements.textSearchButton.disabled = disabled;
            }
            if (elements.textQueryInput) {
              elements.textQueryInput.disabled = disabled;
            }
          }
        }

        async function handleImageSearch() {
          if (!elements.imageQueryInput || !elements.imageResults) {
            return;
          }

          const query = elements.imageQueryInput.value.trim();
          if (!validateQuery(query)) {
            return;
          }

          state.lastQuery = query;
          syncSearchInputs();
          setControlsDisabled(TAB_IMAGE, true);
          setLoadingIndicator(true);
          elements.imageResults.innerHTML =
            '<p class="text-sm text-gray-500">Searching images…</p>';

          try {
            const results = await fetchImageResults(query);
            renderImageResults(results);
          } catch (error) {
            console.error('Image search failed:', error);
            elements.imageResults.innerHTML =
              '<p class="text-sm text-red-600">There was a problem fetching the search results. Please try again later.</p>';
            notify('Unable to load images right now.');
          } finally {
            setControlsDisabled(TAB_IMAGE, false);
            setLoadingIndicator(false);
          }
        }

        async function fetchImageResults(query) {
          const response = await fetch(
            `https://commons.wikimedia.org/w/api.php?action=query&list=search&format=json&origin=*&srsearch=${encodeURIComponent(
              query
            )}&srnamespace=6&srlimit=20`
          );

          if (!response.ok) {
            throw new Error(`Search request failed (${response.status})`);
          }

          const data = await response.json();
          const searchResults = data?.query?.search ?? [];

          const imageResults = searchResults.filter((result) =>
            /\.(png|jpe?g)$/i.test(result.title)
          );

          const detailRequests = imageResults.map(async (result) => {
            const detailResponse = await fetch(
              `https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&format=json&origin=*&iiprop=url&iiurlwidth=${DEFAULT_IMAGE_WIDTH}&titles=${encodeURIComponent(
                result.title
              )}`
            );
            if (!detailResponse.ok) {
              throw new Error(
                `Image info request failed (${detailResponse.status})`
              );
            }
            const detailData = await detailResponse.json();
            const page = Object.values(detailData.query.pages)[0];
            if (!page?.imageinfo?.length) {
              return null;
            }
            const info = page.imageinfo[0];
            return {
              title: result.title,
              url: info.url,
              thumbUrl: info.thumburl,
            };
          });

          const settled = await Promise.allSettled(detailRequests);
          return settled
            .filter((entry) => entry.status === 'fulfilled' && entry.value)
            .map((entry) => entry.value);
        }

        function renderImageResults(results) {
          if (!elements.imageResults) {
            return;
          }

          elements.imageResults.innerHTML = '';

          if (!results.length) {
            elements.imageResults.innerHTML =
              '<p class="text-sm text-gray-500">No images found. Try a different search term.</p>';
            return;
          }

          const fragment = document.createDocumentFragment();
          results.forEach((result) => {
            if (!result) {
              return;
            }
            const img = document.createElement('img');
            img.src = result.thumbUrl;
            img.alt = result.title;
            img.title = result.title;
            img.loading = 'lazy';
            img.className = 'cursor-pointer rounded shadow';
            img.addEventListener('click', () => {
              parent.postMessage(
                {
                  pluginMessage: {
                    type: 'insert-image',
                    url: result.url,
                    fillSelected: true,
                  },
                },
                '*'
              );
            });
            fragment.appendChild(img);
          });

          elements.imageResults.appendChild(fragment);
        }

        async function handleTextSearch() {
          if (
            !elements.textQueryInput ||
            !elements.textContent ||
            !elements.textTitle
          ) {
            return;
          }

          const query = elements.textQueryInput.value.trim();
          if (!validateQuery(query)) {
            return;
          }

          state.lastQuery = query;
          syncSearchInputs();
          setControlsDisabled(TAB_TEXT, true);
          setLoadingIndicator(true);
          elements.textTitle.textContent = '';
          elements.textContent.innerHTML =
            '<p class="text-sm text-gray-500">Fetching article…</p>';

          try {
            const page = await fetchWikipediaPage(query);
            if (page) {
              elements.textTitle.textContent = page.title;
              elements.textContent.innerHTML = page.content;
              removeNonTextElements(elements.textContent);
              makeContentLinksAbsolute(elements.textContent);
              makeContentClickable();
              styleSections();
            } else {
              elements.textTitle.textContent = 'Page not found';
              elements.textContent.innerHTML = `The page "${query}" does not exist on Wikipedia. Please try a different search term.`;
            }
          } catch (error) {
            console.error('Wikipedia fetch failed:', error);
            elements.textTitle.textContent = 'Error';
            elements.textContent.innerHTML =
              'There was a problem fetching the search results. Please try again later.';
            notify('Unable to load Wikipedia content right now.');
          } finally {
            setControlsDisabled(TAB_TEXT, false);
            setLoadingIndicator(false);
          }
        }

        async function fetchWikipediaPage(query) {
          const response = await fetch(
            `https://en.wikipedia.org/w/api.php?action=parse&format=json&origin=*&page=${encodeURIComponent(
              query
            )}&prop=text&disableeditsection=1`
          );

          if (!response.ok) {
            throw new Error(`Wikipedia request failed (${response.status})`);
          }

          const data = await response.json();
          if (data?.parse?.text?.['*']) {
            return {
              title: data.parse.title,
              content: data.parse.text['*'],
            };
          }
          return null;
        }

        function removeNonTextElements(root) {
          const selectors = [
            'img',
            'video',
            'audio',
            'iframe',
            'figure',
            'picture',
            '.thumb',
            '.thumbinner',
            '.thumbcaption',
            '.gallery',
            '.navbox',
            '.vertical-navbox',
            '.sidebar',
            '.mw-kartographer-map',
            '.infobox',
            '.metadata',
            '.mbox',
            '.ambox',
            '.tmbox',
            'table',
            'script',
            'style',
            'noscript',
            'form',
          ];

          root.querySelectorAll(selectors.join(', ')).forEach((node) => {
            node.remove();
          });
        }

        function makeContentLinksAbsolute(root) {
          const links = Array.from(root.getElementsByTagName('a'));
          links.forEach((link) => {
            const href = link.getAttribute('href');
            if (!href) {
              return;
            }
            if (href.startsWith('/wiki/')) {
              link.setAttribute('href', `https://en.wikipedia.org${href}`);
              link.setAttribute('target', '_blank');
            } else if (href.startsWith('#')) {
              return;
            } else if (!href.startsWith('http')) {
              link.setAttribute('href', `https://en.wikipedia.org${href}`);
              link.setAttribute('target', '_blank');
            } else {
              link.setAttribute('target', '_blank');
            }
          });
        }

        function makeContentClickable() {
          if (!elements.textContent) {
            return;
          }

          const clickableElements = elements.textContent.querySelectorAll(
            'p, h1, h2, h3, h4, h5, h6, li'
          );

          clickableElements.forEach((element) => {
            element.style.cursor = 'pointer';
            element.style.transition = 'background-color 0.2s ease';

            element.addEventListener('mouseenter', () => {
              element.style.backgroundColor = '#f0f0f0';
            });
            element.addEventListener('mouseleave', () => {
              element.style.backgroundColor = 'transparent';
            });
            element.addEventListener('click', (event) => {
              event.stopPropagation();
              insertTextIntoFigma(element);
            });
          });
        }

        function insertTextIntoFigma(element) {
          const richText = extractFormattedText(element);
          parent.postMessage(
            {
              pluginMessage: {
                type: 'insert-formatted-text',
                richText,
              },
            },
            '*'
          );
        }

        function extractFormattedText(element) {
          const segments = [];
          processNode(element, segments);
          return segments;
        }

        function processNode(node, segments) {
          if (shouldSkipNode(node)) {
            return;
          }

          if (node.nodeType === Node.TEXT_NODE) {
            const text = node.textContent;
            if (text) {
              segments.push({
                text,
                format: getCurrentFormat(node.parentElement),
              });
            }
            return;
          }

          if (node.nodeType === Node.ELEMENT_NODE) {
            node.childNodes.forEach((child) => processNode(child, segments));
          }
        }

        function shouldSkipNode(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            const parent = node.parentElement;
            return Boolean(parent && parent.closest(REFERENCE_SELECTOR));
          }

          if (node.nodeType === Node.ELEMENT_NODE) {
            const element = node;
            if (
              element.classList?.contains('reference') ||
              element.classList?.contains('mw-ref')
            ) {
              return true;
            }
            if (
              element.closest?.(REFERENCE_SELECTOR) &&
              element.tagName?.toLowerCase() === 'sup'
            ) {
              return true;
            }
          }

          return false;
        }

        function getCurrentFormat(element) {
          const format = {
            bold: false,
            italic: false,
            link: null,
            superscript: false,
            subscript: false,
            headingLevel: null,
          };

          let current = element;
          while (current && current.id !== 'text-search-content') {
            const tagName = current.tagName?.toLowerCase();

            if (tagName === 'b' || tagName === 'strong') {
              format.bold = true;
            }
            if (tagName === 'i' || tagName === 'em') {
              format.italic = true;
            }
            if (tagName === 'a') {
              format.link = current.getAttribute('href');
            }
            if (tagName === 'sup') {
              format.superscript = true;
            }
            if (tagName === 'sub') {
              format.subscript = true;
            }
            if (tagName && tagName.startsWith('h') && tagName.length === 2) {
              const level = parseInt(tagName[1], 10);
              if (!Number.isNaN(level)) {
                format.headingLevel =
                  format.headingLevel === null
                    ? level
                    : Math.min(format.headingLevel, level);
              }
            }

            current = current?.parentElement;
          }

          return format;
        }

        function styleSections() {
          if (!elements.textContent) {
            return;
          }

          elements.textContent.querySelectorAll('h2').forEach((heading) => {
            heading.style.color = '#202122';
            heading.style.fontFamily = 'serif';
            heading.style.fontSize = '1.5rem';
            heading.style.marginTop = '1.5rem';
            heading.style.marginBottom = '0.5rem';
            heading.style.borderBottom = '1px solid #a2a9b1';
            heading.style.paddingBottom = '0.25rem';
          });

          elements.textContent.querySelectorAll('h3').forEach((heading) => {
            heading.style.color = '#202122';
            heading.style.fontFamily = 'serif';
            heading.style.fontSize = '1.25rem';
            heading.style.marginTop = '1.25rem';
            heading.style.marginBottom = '0.25rem';
          });
        }

        window.addEventListener('message', (event) => {
          const pluginMessage = event.data?.pluginMessage;
          if (!pluginMessage) {
            return;
          }

          if (pluginMessage.type === 'showLoading') {
            setLoadingIndicator(pluginMessage.show === true);
          }
        });

        if (elements.tabImage) {
          elements.tabImage.addEventListener('click', (event) => {
            event.preventDefault();
            switchTab(TAB_IMAGE);
          });
        }

        if (elements.tabText) {
          elements.tabText.addEventListener('click', (event) => {
            event.preventDefault();
            switchTab(TAB_TEXT);
          });
        }

        if (elements.imageSearchButton) {
          elements.imageSearchButton.addEventListener('click', (event) => {
            event.preventDefault();
            handleImageSearch();
          });
        }

        if (elements.textSearchButton) {
          elements.textSearchButton.addEventListener('click', (event) => {
            event.preventDefault();
            handleTextSearch();
          });
        }

        if (elements.imageQueryInput) {
          elements.imageQueryInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              handleImageSearch();
            }
          });
        }

        if (elements.textQueryInput) {
          elements.textQueryInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              handleTextSearch();
            }
          });
        }

        switchTab(TAB_IMAGE);
      });
    </script>
  </head>
  <body class="font-sans p-4">
    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="fixed top-0 left-0 right-0 h-1 bg-gray-200 hidden">
        <div class="h-full bg-blue-500 transition-all duration-300 ease-out" style="width: 0%;"></div>
    </div>
    <h2 class="text-2xl font-bold mb-1">Commons & Wikipedia Search</h2>
    <nav class="-mb-px flex space-x-8" aria-label="Tabs">
      <a href="#" class="whitespace-nowrap py-2 px-1 font-medium text-sm text-blue-600 border-b-2 border-blue-500" id="tab-image" data-tab="image" aria-current="page">Image</a>
      <a href="#" class="whitespace-nowrap py-2 px-1 font-medium text-sm text-gray-500 border-b-2 border-transparent" id="tab-text" data-tab="text" aria-current="false">Text</a>
    </nav>
    <div class="tab-content">
      <div id="tab-image-content">
        <div class="flex items-center space-x-2 mb-2 mt-4">
          <input type="text" id="search-query" class="border border-gray-300 p-2 rounded w-full focus:border-orange-500" placeholder="Search images..." />
          <button id="search-image-button" class="bg-blue-500 text-white px-4 py-2 rounded">Search</button>
        </div>
        <div id="search-results" class="mt-4 grid grid-cols-1 gap-4"></div>
      </div>
      <div id="tab-text-content" class="hidden">
        <div class="flex items-center space-x-2 mb-2 mt-4">
          <input type="text" id="text-search-query" class="border border-gray-300 p-2 rounded w-full focus:border-orange-500" placeholder="Search Wikipedia..." />
          <button id="search-text-button" class="bg-blue-500 text-white px-4 py-2 rounded">Search</button>
        </div>
        <h3 id="text-search-title" class="text-xl font-bold mt-4"></h3>
        <div id="text-search-content" class="mt-4"></div>
      </div>
    </div>
  </body>
</html>
